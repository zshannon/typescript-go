name: Bun Tests

on:
  push:
    paths:
      - 'bun/**'
      - '.github/workflows/bun-test.yml'
  pull_request:
    paths:
      - 'bun/**'
      - '.github/workflows/bun-test.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build native library
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -o bun/libtsgo.so ./bun

      - name: Install dependencies
        working-directory: bun
        run: bun install

      - name: Type check
        working-directory: bun
        run: bun run build:types

      - name: Run tests
        working-directory: bun
        run: bun test
