name: Deploy TSGo to exe.dev

on:
  workflow_call:
    inputs:
      cpu:
        default: '2'
        required: false
        type: string
      disk:
        default: 10GB
        required: false
        type: string
      image:
        default: ghcr.io/zshannon/typescript-go/server:latest
        required: false
        type: string
      memory:
        default: 2GB
        required: false
        type: string
      region:
        default: lax
        required: false
        type: string
      replace_existing:
        default: false
        required: false
        type: boolean
      vm_name:
        default: tsgo-bench
        required: false
        type: string
  workflow_dispatch:
    inputs:
      cpu:
        default: '2'
        description: exe.dev vCPU count
        required: true
      disk:
        default: 10GB
        description: exe.dev disk size
        required: true
      image:
        default: ghcr.io/zshannon/typescript-go/server:latest
        description: Container image to deploy
        required: true
      memory:
        default: 2GB
        description: exe.dev memory size
        required: true
      region:
        default: lax
        description: exe.dev region for new VMs
        required: true
      replace_existing:
        default: false
        description: Delete and recreate the named VM before deploying
        required: true
        type: boolean
      vm_name:
        default: tsgo-bench
        description: exe.dev VM name
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISK_CACHE_PATH: /data/cache
      GHCR_REGISTRY_AUTH: ${{ github.actor }}:${{ github.token }}
      OTEL_SERVICE_NAME: fly-tsgo-exedev

    steps:
      - name: Load TSGo deploy secrets
        id: load_secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          AWS_ACCESS_KEY_ID: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_TIGRIS/AWS_ACCESS_KEY_ID
          AWS_ENDPOINT_URL_S3: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_TIGRIS/AWS_ENDPOINT_URL_S3
          AWS_REGION: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_TIGRIS/AWS_REGION
          AWS_SECRET_ACCESS_KEY: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_TIGRIS/AWS_SECRET_ACCESS_KEY
          EXE_DEV_SSH_PRIVATE_KEY: op://tsgo Production/EXE_DEV/private key?ssh-format=openssh
          HONEYCOMB_API_KEY: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_HONEYCOMB/credential
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONEPASSWORD_SERVICE_ACCOUNT }}
          S3_BUCKET: op://chci4awhcucoy66jgoombntpu4/FLY_TSGO_TIGRIS/S3_BUCKET
          TSGO_AUTH_PUBLIC_KEY: op://chci4awhcucoy66jgoombntpu4/flick-staging-tsgo/public-key

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          log-public-key: false
          ssh-private-key: ${{ steps.load_secrets.outputs.EXE_DEV_SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ssh-keyscan exe.dev >> ~/.ssh/known_hosts

      - name: Deploy VM
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.load_secrets.outputs.AWS_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL_S3: ${{ steps.load_secrets.outputs.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ steps.load_secrets.outputs.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.load_secrets.outputs.AWS_SECRET_ACCESS_KEY }}
          EXEDEV_CPU: ${{ inputs.cpu }}
          EXEDEV_DISK: ${{ inputs.disk }}
          EXEDEV_IMAGE: ${{ inputs.image }}
          EXEDEV_MEMORY: ${{ inputs.memory }}
          EXEDEV_REGION: ${{ inputs.region }}
          HONEYCOMB_API_KEY: ${{ steps.load_secrets.outputs.HONEYCOMB_API_KEY }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          S3_BUCKET: ${{ steps.load_secrets.outputs.S3_BUCKET }}
          TSGO_AUTH_PUBLIC_KEY: ${{ steps.load_secrets.outputs.TSGO_AUTH_PUBLIC_KEY }}
          VM_NAME: ${{ inputs.vm_name }}
        run: |
          set -euo pipefail
          ssh exe.dev set-region "$EXEDEV_REGION"

          if [[ "$REPLACE_EXISTING" == "true" ]]; then
            ssh exe.dev rm "$VM_NAME" || true
          fi

          ssh exe.dev new \
            --name "$VM_NAME" \
            --image "$EXEDEV_IMAGE" \
            --registry-auth "$GHCR_REGISTRY_AUTH" \
            --cpu "$EXEDEV_CPU" \
            --memory "$EXEDEV_MEMORY" \
            --disk "$EXEDEV_DISK" \
            --env "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            --env "AWS_ENDPOINT_URL_S3=$AWS_ENDPOINT_URL_S3" \
            --env "AWS_REGION=$AWS_REGION" \
            --env "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            --env "DISK_CACHE_PATH=$DISK_CACHE_PATH" \
            --env "HONEYCOMB_API_KEY=$HONEYCOMB_API_KEY" \
            --env "OTEL_SERVICE_NAME=$OTEL_SERVICE_NAME" \
            --env "S3_BUCKET=$S3_BUCKET" \
            --env "TSGO_AUTH_PUBLIC_KEY=$TSGO_AUTH_PUBLIC_KEY" \
            --tag tsgo \
            --tag exedev \
            --comment="TSGo-${GITHUB_SHA}" \
            --json

          ssh exe.dev share port "$VM_NAME" 8080
          ssh exe.dev share set-public "$VM_NAME"
