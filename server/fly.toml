# fly.toml app configuration file generated for server-wild-sea-9370 on 2025-08-04T16:08:48-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'server-wild-sea-9370'
primary_region = 'sjc'

[build]

[env]
AWS_ENDPOINT_URL_S3 = "https://t3.storage.dev"
AWS_REGION = "auto"
CACHE_SIZE = "67108864"                        # 64MB
S3_BUCKET = "fly-tsgo-node-modules"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']
idle_timeout = '10m'

[[http_service.checks]]
interval = "1s"
timeout = "1s"
grace_period = "5s"
method = "GET"
path = "/health"

[[vm]]
size = 'performance-2x'
memory = 4096

[metrics]
port = 9091
path = "/metrics"
